services:
  web:
    # Main application container that serves both Django APIs and the built
    # React frontend.
    build:
      context: .
      args:
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY}"
        VITE_DELIVERY_SIMULATION_POLL_SECONDS: "${VITE_DELIVERY_SIMULATION_POLL_SECONDS:-15}"
    volumes:
      - media_data:/app/media
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-./credentials/application_default_credentials.json}:/app/credentials/application_default_credentials.json:ro
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      payments:
        condition: service_healthy
      stuart:
        condition: service_healthy
    environment:
      DJANGO_DEBUG: "${DJANGO_DEBUG:-true}"
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost,0.0.0.0,.trycloudflare.com}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:8000}"
      DJANGO_DB_ENGINE: "django.db.backends.postgresql"
      DJANGO_DB_HOST: "db"
      DJANGO_DB_PORT: "5432"
      DJANGO_DB_NAME: "${POSTGRES_DB:-bristol_marketplace}"
      DJANGO_DB_USER: "${POSTGRES_USER:-postgres}"
      DJANGO_DB_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-587}"
      EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
      EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
      EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
      EMAIL_USE_SSL: "${EMAIL_USE_SSL:-false}"
      DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-noreply@localfood.test}"
      ACCOUNT_EMAIL_SUPPRESS_DOMAINS: "${ACCOUNT_EMAIL_SUPPRESS_DOMAINS:-example.com,example.org,example.net,invalid,localhost,local,localfood.test,test}"
      ACCOUNT_EMAIL_SUPPRESS_LOCAL_PARTS: "${ACCOUNT_EMAIL_SUPPRESS_LOCAL_PARTS:-dummy,example,fake,test}"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_51_placeholder_replace_me}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder_replace_me}"
      PAYMENT_SERVICE_BASE_URL: "http://payments:8010"
      PAYMENT_SERVICE_SHARED_SECRET: "${PAYMENT_SERVICE_SHARED_SECRET:-local-payment-service-secret}"
      STUART_SERVICE_BASE_URL: "http://stuart:8020"
      STUART_SERVICE_SHARED_SECRET: "${STUART_SERVICE_SHARED_SECRET:-local-stuart-service-secret}"
      STUART_SERVICE_TIMEOUT_SECONDS: "${STUART_SERVICE_TIMEOUT_SECONDS:-15}"
      STUART_WEBHOOK_SECRET: "${STUART_WEBHOOK_SECRET:-}"
      DELIVERY_SIMULATION_ENABLED: "${DELIVERY_SIMULATION_ENABLED:-true}"
      DELIVERY_SIMULATION_TOTAL_SECONDS: "${DELIVERY_SIMULATION_TOTAL_SECONDS:-120}"
      DELIVERY_SIMULATION_POLL_SECONDS: "${DELIVERY_SIMULATION_POLL_SECONDS:-15}"
      VERTEX_AI_PROJECT_ID: "${VERTEX_AI_PROJECT_ID:-}"
      VERTEX_AI_LOCATION: "${VERTEX_AI_LOCATION:-us-central1}"
      VERTEX_AI_MODEL: "${VERTEX_AI_MODEL:-gemini-2.5-flash}"
      VERTEX_AI_TIMEOUT_SECONDS: "${VERTEX_AI_TIMEOUT_SECONDS:-30}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      VERTEX_AI_API_KEY: "${VERTEX_AI_API_KEY:-}"
      GOOGLE_APPLICATION_CREDENTIALS: "${GOOGLE_APPLICATION_CREDENTIALS:-/app/credentials/application_default_credentials.json}"
    command: >
      sh -c "
      until python manage.py migrate; do
        echo 'Database unavailable - retrying in 2s...';
        sleep 2;
      done &&
      python manage.py seed_demo_data &&
      python manage.py seed_catalog_demo &&
      python manage.py runserver 0.0.0.0:8000
      "

  payments:
    # Internal Stripe wrapper service used by Django for checkout sessions,
    # webhook verification, and payment state lookup.
    build:
      context: .
      dockerfile: payment_service/Dockerfile
    environment:
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_51_placeholder_replace_me}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-whsec_placeholder_replace_me}"
      PAYMENT_SERVICE_SHARED_SECRET: "${PAYMENT_SERVICE_SHARED_SECRET:-local-payment-service-secret}"
      PAYMENT_SERVICE_PORT: "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12

  stuart:
    # Internal Stuart wrapper service used for delivery-job creation,
    # cancellation, refresh, and sandbox OAuth handling.
    build:
      context: .
      dockerfile: stuart_service/Dockerfile
    environment:
      STUART_CLIENT_ID: "${STUART_CLIENT_ID:-}"
      STUART_CLIENT_SECRET: "${STUART_CLIENT_SECRET:-}"
      STUART_ACCOUNT_ID: "${STUART_ACCOUNT_ID:-}"
      STUART_BASE_URL: "${STUART_BASE_URL:-https://api.sandbox.stuart.com}"
      STUART_SERVICE_SHARED_SECRET: "${STUART_SERVICE_SHARED_SECRET:-local-stuart-service-secret}"
      STUART_SERVICE_PORT: "8020"
      STUART_TIMEOUT_SECONDS: "${STUART_TIMEOUT_SECONDS:-20}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health').read()"]
      interval: 5s
      timeout: 5s
      retries: 12

  db:
    # Primary runtime database. The active project setup uses PostgreSQL.
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-bristol_marketplace}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  # Named volumes keep database state and uploaded media across container
  # rebuilds.
  postgres_data:
  media_data:
